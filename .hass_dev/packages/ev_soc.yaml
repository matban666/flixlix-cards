# Demo EV state of charge for the showcase's car icon.
input_number:
  ev_soc:
    name: EV state of charge
    min: 0
    max: 100
    step: 1
    initial: 65
    unit_of_measurement: "%"
    mode: slider

# Demo plug state and alert for the showcase: "plug in" while the EV is below 40% and unplugged.
input_boolean:
  ev_plugged:
    name: EV plugged in
    initial: false

template:
  - sensor:
      - name: EV alert
        unique_id: demo_ev_alert
        state: >
          {% if states('input_number.ev_soc') | float(100) < 40
                and is_state('input_boolean.ev_plugged', 'off') %}plug in{% endif %}
