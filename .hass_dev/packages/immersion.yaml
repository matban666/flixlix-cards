# Demo immersion heater power and hot water cylinder temperature for the showcase.
input_number:
  immersion_power:
    name: Immersion power
    min: 0
    max: 3000
    step: 50
    initial: 1500
    unit_of_measurement: W
    mode: slider
  hot_water_temperature:
    name: Hot water temperature
    min: 10
    max: 70
    step: 1
    initial: 55
    unit_of_measurement: "°C"
    mode: slider
