title: PFCP Showcase 
views:
  - type: sections
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Icon path + third metric
            heading_style: title
            badges: []
          - type: custom:power-flow-card-plus
            entities:
              grid:
                entity: input_number.grid_power_combined
                icon_path: "M7,2V13H10V22L17,10H13L17,2H7Z"
                secondary_info:
                  # Demo "imported today": |grid power| x 4 h, in kWh.
                  template: "{{ (states('input_number.grid_power_combined') | float(0) | abs * 4 / 1000) | round(1) }} kWh"
                display_state: one_way
              solar:
                entity: input_number.solar_power
                secondary_info:
                  # Demo "energy today": current solar power x 4 h, in kWh.
                  template: "{{ (states('input_number.solar_power') | float(0) * 4 / 1000) | round(1) }} kWh"
                tertiary_info:
                  entity: input_number.battery_soc
                  unit_of_measurement: "%"
                  decimals: 0
              battery:
                entity: input_number.battery_power_combined
                display_state: one_way
                state_of_charge: sensor.battery_energy
                state_of_charge_unit: kWh
                state_of_charge_decimals: 1
                icon_path: "M0.5,4.5H31V8.5H33.5V15.5H31V19.5H0.5Z"
                icon_viewbox: "0 0 34 24"
                tertiary_info:
                  entity: input_number.battery_soc
                  show_unit: false
                  font_scale: 1.5
                  color: black
                  # Centre on the body, not body + terminal (terminal adds 2.5 of the 34 units).
                  offset_x: -0.05
                  offset_y: 0.04
                  decimals: 0
              home:
                secondary_info:
                  # Demo "used today": (solar + |grid|) x 4 h, in kWh.
                  template: "{{ ((states('input_number.solar_power') | float(0) + states('input_number.grid_power_combined') | float(0) | abs) * 4 / 1000) | round(1) }} kWh"
                icon_path: "M14,1.5L27.5,11.5H24.5V22H3.5V11.5H0.5ZM19,3H22V8H19Z"
                icon_viewbox: "0 0 28 24"
                tertiary_info:
                  entity: input_number.indoor_temperature
                  # Show "21°" rather than "21 °C".
                  unit_of_measurement: "°"
                  unit_white_space: false
                  font_scale: 1.5
                  color: black
                  # Sit in the walls, below the roof.
                  offset_y: 0.2
                  decimals: 0
              individual:
                - entity: input_number.ev_power
                  # "!" badge and "(plug in)" while sensor.ev_alert has a state (below 40% and unplugged).
                  alert:
                    entity: sensor.ev_alert
                  icon_path: "M3,19.6L1.8,18.8L1.6,10.8Q1.7,8 3.9,6.4L6.1,1.7Q6.5,0.8 8,0.8H24Q25.5,0.8 25.9,1.7L28.1,6.4Q30.3,8 30.4,10.8L30.2,18.8L29,19.6ZM0.25,5.6A1.5,1.2 0 1,1 3.25,5.6A1.5,1.2 0 1,1 0.25,5.6ZM28.75,5.6A1.5,1.2 0 1,1 31.75,5.6A1.5,1.2 0 1,1 28.75,5.6ZM3,5.3H4.6V6.1H3ZM27.4,5.3H29V6.1H27.4ZM1.8,18.6H5.3V22.6Q5.3,23.2 4.7,23.2H2.4Q1.8,23.2 1.8,22.6ZM26.7,18.6H30.2V22.6Q30.2,23.2 29.6,23.2H27.3Q26.7,23.2 26.7,22.6ZM5.2,6.2H26.8L24.6,1.8H7.4ZM2.6,9.5A2.3,2.3 0 1,0 7.2,9.5A2.3,2.3 0 1,0 2.6,9.5ZM24.8,9.5A2.3,2.3 0 1,0 29.4,9.5A2.3,2.3 0 1,0 24.8,9.5ZM3.5,9.5A1.4,1.4 0 1,1 6.3,9.5A1.4,1.4 0 1,1 3.5,9.5ZM25.7,9.5A1.4,1.4 0 1,1 28.5,9.5A1.4,1.4 0 1,1 25.7,9.5Z"
                  icon_color: "#43a047"
                  icon_viewbox: "0 0 32 24"
                  secondary_info:
                    # Demo "charged today": EV power x 2 h, in kWh.
                    template: "{{ (states('input_number.ev_power') | float(0) * 2 / 1000) | round(1) }} kWh"
                  tertiary_info:
                    entity: input_number.ev_soc
                    show_unit: false
                    font_scale: 1.5
                    offset_y: 0.06
                    color: black
                    decimals: 0
                - entity: input_number.immersion_power
                  name: Immersion
                  icon_path: "M3.5,5.5Q3.5,2.5 12,2.5Q20.5,2.5 20.5,5.5V19.5Q20.5,22.5 12,22.5Q3.5,22.5 3.5,19.5ZM8,1H10V4H8ZM14,1H16V4H14Z"
                  secondary_info:
                    # Demo "heated today": immersion power x 2 h, in kWh.
                    template: "{{ (states('input_number.immersion_power') | float(0) * 2 / 1000) | round(1) }} kWh"
                  tertiary_info:
                    entity: input_number.hot_water_temperature
                    unit_of_measurement: "°"
                    unit_white_space: false
                    font_scale: 1.5
                    color: black
                    offset_y: 0.03
                    decimals: 0
            # Extra readings in the free bottom-left corner (or a bottom row if there is none).
            extra_metrics:
              - entity: input_number.outside_temperature
                icon: mdi:thermometer
                decimals: 1
              - entity: input_number.outside_humidity
                icon: mdi:water-percent
              - entity: input_number.aurora_value
                icon: mdi:aurora
                decimals: 0
            clickable_entities: true
            display_zero_lines: true
      - type: grid
        cards:
          - type: heading
            heading: Full Example
            heading_style: title
            badges: []
          - type: custom:power-flow-card-plus
            entities:
              battery:
                entity: input_number.battery_power_combined
                state_of_charge: input_number.battery_soc
              grid:
                entity: input_number.grid_power_combined
              solar:
                entity: input_number.solar_power
              fossil_fuel_percentage:
                entity: input_number.fossil_fuel_percentage
            clickable_entities: true
            display_zero_lines: true
            use_new_flow_rate_model: true
            base_decimals: 0
            kilo_decimals: 1
            min_flow_rate: 0.75
            max_flow_rate: 6
            max_expected_power: 2000
            min_expected_power: 0.01
            kilo_threshold: 1000
            transparency_zero_lines: 0
            sort_individual_devices: false
      - type: grid
        cards:
          - type: heading
            heading: Grid Only
            heading_style: title
            icon: mdi:transmission-tower
          - type: custom:power-flow-card-plus
            entities:
              grid:
                entity: input_number.grid_power_combined
            clickable_entities: true
            display_zero_lines: true
            use_new_flow_rate_model: true
            base_decimals: 0
            kilo_decimals: 1
            min_flow_rate: 0.75
            max_flow_rate: 6
            max_expected_power: 2000
            min_expected_power: 0.01
            kilo_threshold: 1000
            transparency_zero_lines: 0
            sort_individual_devices: false
          - type: heading
            icon: mdi:generator-portable
            heading: Power Outage
            heading_style: subtitle
          - type: tile
            entity: input_boolean.power_outage_state
            vertical: false
            features_position: inline
            features:
              - type: toggle
          - type: custom:power-flow-card-plus
            entities:
              grid:
                entity: input_number.grid_power_combined
                power_outage:
                  entity: input_boolean.power_outage_state
                  entity_generator: input_number.generator_power
                  state_alert: 'on'
                  label_alert: Outage
            clickable_entities: true
            display_zero_lines: true
            use_new_flow_rate_model: true
            base_decimals: 0
            kilo_decimals: 1
            min_flow_rate: 0.75
            max_flow_rate: 6
            max_expected_power: 2000
            min_expected_power: 0.01
            kilo_threshold: 1000
            transparency_zero_lines: 0
            sort_individual_devices: false
      - type: grid
        cards:
          - type: heading
            heading: Solar
            heading_style: title
            icon: mdi:solar-power
          - type: custom:power-flow-card-plus
            entities:
              grid:
                entity: input_number.grid_power_combined
              solar:
                entity: input_number.solar_power
            clickable_entities: true
            display_zero_lines: true
            use_new_flow_rate_model: true
            base_decimals: 0
            kilo_decimals: 1
            min_flow_rate: 0.75
            max_flow_rate: 6
            max_expected_power: 2000
            min_expected_power: 0.01
            kilo_threshold: 1000
            transparency_zero_lines: 0
            sort_individual_devices: false
          - type: heading
            icon: mdi:transmission-tower-export
            heading: Grid Export
            heading_style: subtitle
          - type: custom:power-flow-card-plus
            entities:
              grid:
                entity:
                  consumption: input_number.grid_power_import
                  production: input_number.grid_power_export
              solar:
                entity: input_number.solar_power
            clickable_entities: true
            display_zero_lines: true
            use_new_flow_rate_model: true
            base_decimals: 0
            kilo_decimals: 1
            min_flow_rate: 0.75
            max_flow_rate: 6
            max_expected_power: 2000
            min_expected_power: 0.01
            kilo_threshold: 1000
            transparency_zero_lines: 0
            sort_individual_devices: false
      - type: grid
        cards:
          - type: heading
            heading: Battery
            heading_style: title
            icon: mdi:home-battery-outline
          - type: heading
            heading: Separate entities
            heading_style: subtitle
            icon: ''
          - type: custom:power-flow-card-plus
            entities:
              grid:
                entity: input_number.grid_power_combined
              solar:
                entity: input_number.solar_power
              battery:
                entity:
                  consumption: input_number.battery_power_import
                  production: input_number.battery_power_export
            clickable_entities: true
            display_zero_lines: true
            use_new_flow_rate_model: true
            base_decimals: 0
            kilo_decimals: 1
            min_flow_rate: 0.75
            max_flow_rate: 6
            max_expected_power: 2000
            min_expected_power: 0.01
            kilo_threshold: 1000
            transparency_zero_lines: 0
            sort_individual_devices: false
          - type: heading
            icon: ''
            heading: With SoC
            heading_style: subtitle
          - type: custom:power-flow-card-plus
            entities:
              grid:
                entity: input_number.grid_power_combined
              solar:
                entity: input_number.solar_power
              battery:
                entity:
                  consumption: input_number.battery_power_import
                  production: input_number.battery_power_export
                state_of_charge: input_number.battery_soc
                show_state_of_charge: true
            clickable_entities: true
            display_zero_lines: true
            use_new_flow_rate_model: true
            base_decimals: 0
            kilo_decimals: 1
            min_flow_rate: 0.75
            max_flow_rate: 6
            max_expected_power: 2000
            min_expected_power: 0.01
            kilo_threshold: 1000
            transparency_zero_lines: 0
            sort_individual_devices: false
      - type: grid
        cards:
          - type: heading
            heading: Individual Devices
            heading_style: title
            icon: mdi:devices
          - type: heading
            heading: 2 Individuals
            heading_style: subtitle
            icon: ''
          - type: custom:power-flow-card-plus
            entities:
              grid: &ref_0
                entity: input_number.grid_power_combined
              solar: &ref_1
                entity: input_number.solar_power
              battery:
                entity: &ref_2
                  consumption: input_number.battery_power_import
                  production: input_number.battery_power_export
                state_of_charge: input_number.battery_soc
              individual:
                - &ref_3
                  entity: input_number.ev_power
                  name: Car
                  icon: mdi:car-electric
                  show_direction: true
                - &ref_4
                  entity: input_number.washing_machine_power
                  name: Washing
                  icon: mdi:washing-machine
            clickable_entities: true
            display_zero_lines: true
            use_new_flow_rate_model: true
            base_decimals: 0
            kilo_decimals: 1
            min_flow_rate: 0.75
            max_flow_rate: 6
            max_expected_power: 2000
            min_expected_power: 0.01
            kilo_threshold: 1000
            transparency_zero_lines: 0
            sort_individual_devices: false
          - type: heading
            icon: ''
            heading: 4 Individuals
            heading_style: subtitle
          - type: custom:power-flow-card-plus
            entities:
              grid: *ref_0
              solar: *ref_1
              battery:
                entity: *ref_2
                state_of_charge: input_number.battery_soc
              individual:
                - *ref_3
                - *ref_4
                - entity: input_number.dishwasher_power
                  name: DIshwasher
                  icon: mdi:dishwasher
                - entity: input_number.dryer_power
                  name: Dryer
                  icon: mdi:tumble-dryer
            clickable_entities: true
            display_zero_lines: true
            use_new_flow_rate_model: true
            base_decimals: 0
            kilo_decimals: 1
            min_flow_rate: 0.75
            max_flow_rate: 6
            max_expected_power: 2000
            min_expected_power: 0.01
            kilo_threshold: 1000
            transparency_zero_lines: 0
            sort_individual_devices: false
    max_columns: 2
    cards: []
    dense_section_placement: true
